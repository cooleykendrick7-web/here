{# THE badge: a golden music note with HERE written through
   it in chrome, floating in a clear jelly bubble. Sized by
   the ab_size variable (default 54). #}
<span class="abadge" title="HERE Verified Artist" style="display:inline-block;width:{{ ab_size|default(54) }}px;height:{{ ab_size|default(54) }}px;vertical-align:middle;line-height:0">
<svg viewBox="0 0 120 120" width="100%" height="100%" aria-label="HERE Verified Artist">
  <defs>
    <linearGradient id="ab-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".45" stop-color="#f5c542"/>
      <stop offset=".8" stop-color="#c8912a"/>
      <stop offset="1" stop-color="#f7d774"/>
    </linearGradient>
    <linearGradient id="ab-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset=".5" stop-color="#a9abb3"/>
      <stop offset=".55" stop-color="#e8e9ed"/>
      <stop offset="1" stop-color="#83858d"/>
    </linearGradient>
    <radialGradient id="ab-bubble" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#ab-bubble)" stroke="rgba(255,255,255,.65)" stroke-width="1.6"/>
  <g fill="url(#ab-gold)" stroke="#8a6508" stroke-width="1">
    <polygon points="52,40 98,31 98,47 52,56"/>
    <rect x="52" y="40" width="5.5" height="46"/>
    <rect x="92.5" y="31" width="5.5" height="47"/>
    <ellipse cx="42" cy="88" rx="12" ry="8.5" transform="rotate(-16 42 88)"/>
    <ellipse cx="82" cy="80" rx="12" ry="8.5" transform="rotate(-16 82 80)"/>
  </g>
  <text x="60" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" fill="url(#ab-chrome)" stroke="rgba(0,0,0,.45)" stroke-width=".7">HERE</text>
  <ellipse cx="41" cy="30" rx="21" ry="10" fill="#ffffff" opacity=".38" transform="rotate(-18 41 30)"/>
</svg>
</span>
