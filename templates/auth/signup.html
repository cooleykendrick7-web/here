<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERE — Sign Up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:#0a0a0a;color:#f0f0f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{font-size:72px;font-weight:900;color:#d41f2e;letter-spacing:-3px;text-shadow:0 0 40px rgba(212,31,46,.45)}
.tagline{color:#9a9a9a;margin:6px 0 28px;font-size:16px}
.auth-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(212,31,46,.15)}
.auth-card h2{margin-bottom:18px;font-size:22px}
.err{background:rgba(212,31,46,.15);border:1px solid #d41f2e;color:#ff8f98;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:#bbb;margin-bottom:5px}
.field input{width:100%;background:#1f1f1f;border:1px solid #333;border-radius:8px;padding:11px 13px;color:#f0f0f0;font-size:15px;outline:none}
.field input:focus{border-color:#d41f2e}
.btn{width:100%;background:#d41f2e;color:#fff;border:none;border-radius:8px;padding:12px;font-size:16px;font-weight:800;cursor:pointer}
.btn:hover{background:#a8151f}
.switch{margin-top:16px;text-align:center;font-size:14px;color:#9a9a9a}
.switch a{color:#d41f2e;font-weight:700}
.owner-h{position:fixed;bottom:10px;left:0;right:0;text-align:center}
.owner-h a{color:#ffd400;font-size:12px;text-decoration:none;opacity:.85}
.owner-h a:hover{opacity:1}
</style>
</head>
<body>
<div class="brand">HERE</div>
<div class="tagline">Your people. Your pages. Your world.</div>
<div class="auth-card">
  <h2>Sign Up — it's free</h2>
  {% if error %}<div class="err">{{ error|e }}</div>{% endif %}
  <form action="/signup" method="post">
    <div class="field">
      <label for="su-name">Name</label>
      <input type="text" id="su-name" name="name" required maxlength="80" autocomplete="name">
    </div>
    <div class="field">
      <label for="su-email">Email</label>
      <input type="email" id="su-email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="su-pass">Password</label>
      <input type="password" id="su-pass" name="password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>
  <div class="switch">Already on HERE? <a href="/login">Log in</a></div>
</div>
<div class="owner-h"><a href="/owner/login" title="">H</a></div>
</body>
</html>
