{% extends "base.html" %}
{% block title %}HERE — Home{% endblock %}
{% block content %}

<div class="card composer">
  <form action="/posts" method="post" enctype="multipart/form-data">
    <input type="hidden" name="kind" id="kind-input" value="text">
    <div class="kind-tabs" id="kind-tabs">
      <button type="button" class="kind-tab active" data-kind="text">📝 Status</button>
      <button type="button" class="kind-tab" data-kind="photo">📷 Photo</button>
      <button type="button" class="kind-tab" data-kind="feeling">😊 Feeling</button>
      <button type="button" class="kind-tab" data-kind="clothes">👕 Clothes</button>
      <button type="button" class="kind-tab" data-kind="link">🔗 Link</button>
      <button type="button" class="kind-tab" data-kind="video">🎬 Video</button>
      <button type="button" class="kind-tab" data-kind="audio">🎵 Music</button>
    </div>
    <textarea name="body" id="composer-body" placeholder="What's on your mind?"></textarea>

    <div id="fld-feeling" style="display:none">
      <label class="fld" for="feeling-select">Feeling</label>
      <select name="feeling" id="feeling-select">
        <option value="">— pick a feeling —</option>
        <option>happy</option><option>excited</option><option>loved</option>
        <option>blessed</option><option>grateful</option><option>thankful</option>
        <option>relaxed</option><option>proud</option><option>motivated</option>
        <option>sad</option><option>tired</option><option>sick</option>
        <option>angry</option><option>annoyed</option><option>lonely</option>
      </select>
    </div>

    <div id="fld-media" style="display:none">
      <label class="fld" for="media-file">Upload <span id="media-kind-label">photo</span> (jpg, png, gif, webp · mp3 for music · max 25MB)</label>
      <input type="file" name="media" id="media-file" accept="image/*,audio/*">
    </div>

    <div id="fld-link" style="display:none">
      <label class="fld" for="link-url">Link URL (must start with http)</label>
      <input type="url" name="link_url" id="link-url" placeholder="https://example.com">
    </div>

    <div id="fld-video" style="display:none">
      <label class="fld" for="video-url">Video URL (YouTube or Vimeo)</label>
      <input type="url" name="video_url" id="video-url" placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <div class="post-row" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <label class="fld" style="margin:0;font-size:14px">👁
        <select name="privacy" style="border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px">
          <option value="public">🌍 Public</option>
          <option value="friends">👥 Friends</option>
          <option value="onlyme">🔒 Only me</option>
        </select>
      </label>
      <button type="submit" class="btn">Post</button>
    </div>
  </form>
</div>

{% for post in posts %}
  {% include "partials/post_card.html" %}
{% else %}
<div class="card"><p style="color:var(--muted)">No posts yet. Be the first to say something!</p></div>
{% endfor %}

{% endblock %}

{% block scripts %}
<script>
(function(){
  var tabs = document.querySelectorAll('#kind-tabs .kind-tab');
  var kindInput = document.getElementById('kind-input');
  var bodyBox = document.getElementById('composer-body');
  var fFeeling = document.getElementById('fld-feeling');
  var fMedia = document.getElementById('fld-media');
  var fLink = document.getElementById('fld-link');
  var fVideo = document.getElementById('fld-video');
  var mediaLbl = document.getElementById('media-kind-label');
  var placeholders = {
    text: "What's on your mind?",
    photo: "Say something about this photo…",
    feeling: "What's going on?",
    clothes: "Show off the fit…",
    link: "Why share this link?",
    video: "What is this video about?",
    audio: "Drop a track…"
  };
  function setKind(kind){
    kindInput.value = kind;
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.kind === kind); });
    bodyBox.placeholder = placeholders[kind] || placeholders.text;
    fFeeling.style.display = (kind === 'feeling') ? 'block' : 'none';
    fMedia.style.display = (kind === 'photo' || kind === 'clothes' || kind === 'audio') ? 'block' : 'none';
    if (kind === 'audio') mediaLbl.textContent = 'mp3';
    else if (kind === 'clothes') mediaLbl.textContent = 'outfit photo';
    else mediaLbl.textContent = 'photo';
    fLink.style.display = (kind === 'link') ? 'block' : 'none';
    fVideo.style.display = (kind === 'video') ? 'block' : 'none';
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setKind(t.dataset.kind); }); });
  setKind('text');
})();
</script>
{% endblock %}
