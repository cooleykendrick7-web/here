{% extends "base.html" %}
{% block title %}Story — HERE{% endblock %}
{% block content %}
<div id="story-viewer" data-start-id="{{ start_id }}">
  <div class="sv-top">
    <div class="sv-bars" id="sv-bars"></div>
    <div class="sv-head">
      <span id="sv-avatar"></span>
      <div>
        <div class="sv-who" id="sv-name"></div>
        <div class="sv-when" id="sv-when"></div>
      </div>
      <button id="sv-close" type="button" aria-label="Close stories">✕</button>
    </div>
  </div>

  <div class="sv-stage" id="sv-stage">
    <img id="sv-img" alt="story" hidden>
    <video id="sv-vid" playsinline hidden></video>
    <div class="sv-overlay" id="sv-overlay" hidden></div>
    <div class="sv-caption" id="sv-caption" hidden></div>
    <div id="sv-poll" hidden>
      <div class="sv-poll-q" id="sv-poll-q"></div>
      <div id="sv-poll-body"></div>
      <div class="sv-poll-total" id="sv-poll-total"></div>
    </div>
    <div id="sv-textstage" hidden></div>
    <div id="sv-edit-layer"></div>
    <div id="sv-captions" hidden></div>
  </div>
  <style>
    #sv-textstage{position:absolute;inset:0}
    #sv-edit-layer{position:absolute;inset:0;pointer-events:none;z-index:4}
    #sv-edit-layer .se-el{position:absolute;transform:translate(-50%,-50%);max-width:88%}
    #sv-edit-layer .txt{white-space:pre-wrap;word-break:break-word;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    #sv-edit-layer .txt.bg{background:rgba(0,0,0,.62);padding:.18em .5em;border-radius:.45em;text-shadow:none}
    #sv-edit-layer svg.art{display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
    #sv-edit-layer .se-pill-el{display:flex;align-items:center;gap:7px;background:rgba(14,14,17,.82);
      border:1px solid rgba(255,255,255,.25);padding:8px 13px;border-radius:999px;font-weight:700;
      white-space:nowrap;color:#fff}
    #sv-edit-layer .se-pill-el svg{width:17px;height:17px;flex:0 0 auto}
    #sv-edit-layer button.se-el{pointer-events:auto;background:none;border:none;cursor:pointer;font:inherit}
    #sv-captions{position:absolute;left:14px;right:14px;bottom:12px;z-index:5;text-align:center;
      background:rgba(0,0,0,.72);color:#fff;font-weight:700;padding:9px 13px;border-radius:11px;
      font-size:15px;line-height:1.35}
    .sef-deco{font-family:Georgia,'Times New Roman',serif}
    .sef-bubble{font-family:'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;font-weight:700}
    .sef-typewriter{font-family:'Courier New',monospace}
    .sef-meme{font-family:Impact,'Arial Black',sans-serif;text-transform:uppercase;letter-spacing:.02em}
    .sef-strong{font-weight:900}
    .sef-neon{font-weight:800}
  </style>

  <div id="sv-yt-wrap" hidden>
    <div class="sv-yt-frame" id="sv-yt-slot"></div>
    <div class="sv-music" id="sv-music" hidden></div>
  </div>

  <div class="sv-bottom" id="sv-ownbar" hidden>
    <button class="sv-chipbtn" id="sv-viewers-btn" type="button">👀 <span id="sv-viewers-count">0</span> views</button>
    <form id="sv-del-form" method="post" style="margin-left:auto" onsubmit="return confirm('Delete this story?');">
      <button class="sv-chipbtn" type="submit" style="background:rgba(220,38,38,.75)">🗑 Delete this story</button>
    </form>
  </div>

  <div class="sv-bottom" id="sv-replybar" hidden>
    <div class="sv-react-row" id="sv-react-row">
      <button type="button" data-kind="like" title="Like">👍</button>
      <button type="button" data-kind="love" title="Love">❤️</button>
      <button type="button" data-kind="laugh" title="Haha">😂</button>
      <button type="button" data-kind="wow" title="Wow">😮</button>
      <button type="button" data-kind="sad" title="Sad">😢</button>
      <button type="button" data-kind="angry" title="Angry">😡</button>
      <span id="sv-reply-note" hidden></span>
    </div>
    <button class="sv-chipbtn" id="sv-reshare" type="button" hidden style="align-self:flex-start">↗ Share to my story</button>
    <form id="sv-ama-form" hidden>
      <input id="sv-ama-input" type="text" maxlength="2000" autocomplete="off" placeholder="❓ Ask a question…">
      <button class="sv-chipbtn" type="submit">Ask</button>
    </form>
    <form id="sv-reply-form">
      <input id="sv-reply-input" type="text" maxlength="2000" autocomplete="off" placeholder="Reply…">
      <button class="sv-chipbtn" type="submit">Send</button>
    </form>
  </div>

  <div id="sv-novol" hidden>🔊 Tap for sound</div>

  <div id="sv-viewers-sheet" hidden>
    <div style="display:flex;align-items:center;margin-bottom:6px">
      <strong>👀 Viewers</strong>
      <button class="sv-chipbtn" id="sv-viewers-close" type="button" style="margin-left:auto;padding:4px 12px">✕</button>
    </div>
    <div id="sv-viewers-list"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var root = document.getElementById('story-viewer');
  if (!root) return;
  document.body.style.overflow = 'hidden';
  var startId = parseInt(root.getAttribute('data-start-id'), 10);
  var barsEl = document.getElementById('sv-bars');
  var nameEl = document.getElementById('sv-name');
  var whenEl = document.getElementById('sv-when');
  var avatarEl = document.getElementById('sv-avatar');
  var stage = document.getElementById('sv-stage');
  var img = document.getElementById('sv-img');
  var vid = document.getElementById('sv-vid');
  var overlayEl = document.getElementById('sv-overlay');
  var captionEl = document.getElementById('sv-caption');
  var musicEl = document.getElementById('sv-music');
  var ownBar = document.getElementById('sv-ownbar');
  var viewersBtn = document.getElementById('sv-viewers-btn');
  var viewersCount = document.getElementById('sv-viewers-count');
  var viewersSheet = document.getElementById('sv-viewers-sheet');
  var viewersList = document.getElementById('sv-viewers-list');
  var delForm = document.getElementById('sv-del-form');
  var replyBar = document.getElementById('sv-replybar');
  var replyForm = document.getElementById('sv-reply-form');
  var replyInput = document.getElementById('sv-reply-input');
  var replyNote = document.getElementById('sv-reply-note');
  var novol = document.getElementById('sv-novol');
  var ytWrap = document.getElementById('sv-yt-wrap');
  var ytSlot = document.getElementById('sv-yt-slot');
  var pollEl = document.getElementById('sv-poll');
  var pollQ = document.getElementById('sv-poll-q');
  var pollBody = document.getElementById('sv-poll-body');
  var pollTotal = document.getElementById('sv-poll-total');
  var amaForm = document.getElementById('sv-ama-form');
  var amaInput = document.getElementById('sv-ama-input');
  var ytPlayer = null;

  var ME = 0;
  var flat = [];        // [{g, s, gname...}] flattened queue
  var idx = -1;
  var durationMs = 5000;
  var startedAt = 0, accum = 0, running = false;
  var ticker = null;
  var curMusic = null;  // music object of the current story
  var vidEnded = false;

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }
  function avatarHTML(g) {
    if (g.avatar) return '<img class="avatar av-40" src="' + esc(g.avatar) + '" alt="">';
    return '<span class="av-ph av-40">' + esc((g.name || '?').charAt(0).toUpperCase()) + '</span>';
  }
  function timeLeft(s) {
    var ms = new Date(s.expires_at).getTime() - Date.now();
    if (isNaN(ms) || ms <= 0) return 'ending soon';
    var mins = Math.round(ms / 60000);
    if (mins < 60) return mins + 'm left';
    var hrs = Math.floor(mins / 60);
    return hrs + 'h left';
  }

  function closeViewer() {
    stopAll();
    document.body.style.overflow = '';
    if (document.referrer && document.referrer.indexOf(location.host) >= 0
        && history.length > 1) {
      history.back();
    } else {
      location.href = '/home';
    }
  }
  function destroyYT() {
    if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
    ytSlot.innerHTML = '';
  }
  function ytPause() {
    if (ytPlayer) { try { ytPlayer.pauseVideo(); } catch (e) {} }
  }
  function stopAll() {
    running = false;
    if (ticker) { clearInterval(ticker); ticker = null; }
    try { vid.pause(); } catch (e) {}
    ytPause();
    destroyYT();
  }
  function elapsed() {
    return accum + (running ? (performance.now() - startedAt) : 0);
  }
  function startClock() {
    accum = 0; startedAt = performance.now(); running = true;
  }
  function pauseClock() {
    if (running) { accum += performance.now() - startedAt; running = false; }
    try { vid.pause(); } catch (e) {}
    ytPause();
  }
  function resumeClock() {
    if (!running) { startedAt = performance.now(); running = true; }
    var item = flat[idx];
    if (item && item.s.is_video && !vidEnded) {
      var p = vid.play(); if (p) p.catch(function () {});
    }
    if (curMusic && ytPlayer) {
      try { ytPlayer.playVideo(); } catch (e) {}
    }
  }

  /* --- Build STORY EDITOR: render the editor's element list --- */
  var SE_ART = {
    heart: '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>',
    star: '<path d="M12 2.4l2.95 6.35 6.95.8-5.15 4.8 1.35 6.85L12 17.85l-6.1 3.35 1.35-6.85-5.15-4.8 6.95-.8z"/>',
    flame: '<path d="M13.6 1.8c.5 2.9-.3 5-1.9 7.2C10.2 11.1 10.9 13 12 14.7c-1.3-.4-2.2-1.3-2.7-2.7-1.3 1.6-2 3.2-2 5.1A5.2 5.2 0 0012.5 22 5.2 5.2 0 0017.7 16.8c0-2-.8-4.1-2-5.7-.4 1.3-1.2 2.1-2.4 2.5.5-3.8.2-8.3.3-11.8z"/>',
    crown: '<path d="M3 18.5h18v2H3zM2.5 7l4.8 3.4L12 5.5l4.7 4.9L21.5 7l-1.8 9.5H4.3L2.5 7z"/>',
    bolt: '<path d="M13.2 2L3.6 14.2h6.7L8.9 22l9.6-12.2h-6.7L13.2 2z"/>',
    moon: '<path d="M20.6 14.5A8.5 8.5 0 1 1 9.5 3.4a7 7 0 1 0 11.1 11.1z"/>',
    music: '<circle cx="6.8" cy="17.8" r="3.1"/><circle cx="17.9" cy="15.8" r="3.1"/><path d="M9.4 17.8V5.4L20.5 3.6v12.2h-2.6V6.5L12 8.1v9.7H9.4z"/>',
    rose: '<circle cx="12" cy="8.6" r="3.4"/><circle cx="7.6" cy="11.4" r="2.5"/><circle cx="16.4" cy="11.4" r="2.5"/><path d="M11.2 12h1.6l-.4 9h-.8l-.4-9z"/><path d="M11.4 16.4c-2.4.2-4-1-4.6-3 2.3-.3 3.9.7 4.6 3zM12.6 18.4c2.4.2 4-1 4.6-3-2.3-.3-3.9.7-4.6 3z"/>',
    gem: '<path d="M6.2 3.5h11.6L21.5 9 12 20.5 2.5 9 6.2 3.5zM7.5 5.4L5.3 7.6h3.9L10.6 5.4H7.5zm5.9 0l1.4 2.2h3.9L16.5 5.4h-3.1zM9 9.4L12 15l3-5.6H9z"/>',
    like: '<path d="M6.8 21.5v-11H3.2v11h3.6zM20.4 10.2H14l.9-4.2c.2-1.9-1-3.2-2.6-3.5L6.8 10.6v10.9h9.6a2.3 2.3 0 002.2-1.8l1.3-6.9a2.3 2.3 0 00-.5-2.6z"/>',
    party: '<path d="M3.5 3.5L12 14l-2.8 1.6L3.5 3.5zM12 14l3.4 6.5-4.6-3L12 14zM20.5 3.5L14.8 15 12 14l8.5-10.5z"/><circle cx="18.6" cy="17.6" r="1.6"/><circle cx="5.4" cy="18.6" r="1.3"/>',
    eyes: '<path fill-rule="evenodd" d="M12 5.2c4.9 0 9.1 2.9 10.9 6.8C21.1 15.9 16.9 18.8 12 18.8S2.9 15.9 1.1 12C2.9 8.1 7.1 5.2 12 5.2zm0 2.3c-3.7 0-7 1.8-8.7 4.5 1.7 2.7 5 4.5 8.7 4.5s7-1.8 8.7-4.5c-1.7-2.7-5-4.5-8.7-4.5zm0 1.3a3.2 3.2 0 110 6.4 3.2 3.2 0 010-6.4z"/>',
    pin: '<path fill-rule="evenodd" d="M12 2.2a7.3 7.3 0 00-7.3 7.3c0 5.4 7.3 12.3 7.3 12.3s7.3-6.9 7.3-12.3A7.3 7.3 0 0012 2.2zm0 10a2.7 2.7 0 110-5.4 2.7 2.7 0 010 5.4z"/>',
    link: '<path d="M10.6 13.4a4.2 4.2 0 005.9 0l3-3a4.24 4.24 0 10-5.9-6l-1.5 1.5 1.4 1.5 1.6-1.6a2.12 2.12 0 113 3l-3 3a2.12 2.12 0 01-3 0l-1.4 1.6zm2.8-2.8a4.2 4.2 0 00-5.9 0l-3 3a4.24 4.24 0 105.9 6l1.5-1.5-1.4-1.5-1.6 1.6a2.12 2.12 0 11-3-3l3-3a2.12 2.12 0 013 0l1.4-1.6z"/>',
    help: '<path fill-rule="evenodd" d="M12 2.5a9.5 9.5 0 100 19 9.5 9.5 0 000-19zM12 5.6c1.9 0 3.4 1.3 3.4 3.1 0 2.3-2.4 2.7-2.4 4.1h-2c0-2.3 2.4-2.4 2.4-4 0-.7-.6-1.2-1.4-1.2-.8 0-1.5.5-1.6 1.3H8.4c.2-2 1.7-3.3 3.6-3.3zM11 15.4h2.1v2.1H11z"/>',
    clock: '<path fill-rule="evenodd" d="M12 2.5a9.5 9.5 0 100 19 9.5 9.5 0 000-19zm1.1 4.4h-2v6.2l4.4 2.6 1-1.8-3.4-2V6.9z"/>',
    chat: '<path d="M5 3.5h14A2.5 2.5 0 0121.5 6v8a2.5 2.5 0 01-2.5 2.5H9.5L5 20.5v-4A2.5 2.5 0 012.5 14V6A2.5 2.5 0 015 3.5z"/>',
    at: '<path d="M12 4a8 8 0 108 8h-2a6 6 0 11-1.2-3.6V12a2.9 2.9 0 11-2-2.6A4.9 4.9 0 1017.7 15c.4 1.7 1.9 3 4.3 3v2c-2.8 0-4.9-1.3-5.9-3A8 8 0 0112 4zm0 3.6a4.4 4.4 0 104.4 4.4A4.4 4.4 0 0012 7.6z"/>'
  };
  var SE_FILTERS = {original:'', vivid:'saturate(1.5) contrast(1.1)',
    noir:'grayscale(1) contrast(1.15)', gold:'sepia(.45) saturate(1.3) hue-rotate(-8deg)',
    cool:'hue-rotate(18deg) saturate(1.1) brightness(1.05)',
    fade:'brightness(1.12) contrast(.85) saturate(.8)',
    glow:'brightness(1.15) saturate(1.25)', punch:'contrast(1.3) saturate(1.4)'};
  var SE_GRADS = {dusk:'linear-gradient(160deg,#23233a,#4a1942 55%,#8f1d22)',
    ember:'linear-gradient(160deg,#1c0f0a,#7a2408 55%,#e04707)',
    ocean:'linear-gradient(160deg,#04141f,#0a4d5c 55%,#0e86a0)',
    forest:'linear-gradient(160deg,#0a1a10,#14532d 55%,#3f9e4d)',
    grape:'linear-gradient(160deg,#170a26,#4c1d95 55%,#9333ea)',
    mono:'linear-gradient(160deg,#0a0a0c,#26262c 55%,#52525b)'};
  var editLayer = document.getElementById('sv-edit-layer');
  var captionsEl = document.getElementById('sv-captions');
  var textStage = document.getElementById('sv-textstage');
  var reshareBtn = document.getElementById('sv-reshare');
  var clockIv = null, boomRev = false;
  function svTimeNow(){ var d = new Date(); var h = d.getHours() % 12; if (h === 0) h = 12;
    var m = d.getMinutes(); return h + ':' + (m < 10 ? '0' : '') + m + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM'); }
  function elPosV(el, d){ el.style.left = d.x + '%'; el.style.top = d.y + '%';
    el.style.transform = 'translate(-50%,-50%) rotate(' + (d.rot || 0) + 'deg)'; }
  function renderEdit(s){
    var e = s.edit || {};
    editLayer.innerHTML = '';
    if (clockIv){ clearInterval(clockIv); clockIv = null; }
    boomRev = false;
    // text-only story: gradient stage, no media
    if (e.mode === 'text'){
      textStage.hidden = false;
      textStage.style.background = SE_GRADS[e.textbg || 'dusk'] || SE_GRADS.dusk;
      img.hidden = true; vid.hidden = true;
    } else {
      textStage.hidden = true;
    }
    var f = SE_FILTERS[e.filter || 'original'] || '';
    img.style.filter = f; vid.style.filter = f;
    (e.texts || []).forEach(function(tx){
      var d = document.createElement('div');
      d.className = 'se-el';
      d.innerHTML = '<div class="txt sef-' + esc(tx.font || 'classic') + (tx.bg ? ' bg' : '') +
        '" style="color:' + esc(tx.color || '#fff') + ';font-size:' + Math.round(27 * (tx.scale || 1)) +
        'px;text-align:' + esc(tx.align || 'center') +
        (tx.font === 'neon' ? ';text-shadow:0 0 7px ' + esc(tx.color || '#fff') + ',0 0 16px ' + esc(tx.color || '#fff') : '') +
        '">' + esc(tx.t) + '</div>';
      elPosV(d, tx);
      editLayer.appendChild(d);
    });
    (e.stickers || []).forEach(function(sk){
      var d;
      if (SE_ART[sk.kind]){
        d = document.createElement('div');
        d.className = 'se-el';
        var sz = Math.round(62 * (sk.scale || 1));
        d.innerHTML = '<svg class="art" viewBox="0 0 24 24" fill="#fff" style="width:' + sz + 'px;height:' + sz + 'px">' + SE_ART[sk.kind] + '</svg>';
      } else if (sk.kind === 'location' || sk.kind === 'time' || sk.kind === 'question'){
        d = document.createElement('div');
        d.className = 'se-el';
        var ic = sk.kind === 'location' ? ['pin', '#ff453a'] : sk.kind === 'time' ? ['clock', '#fff'] : ['help', '#ffd60a'];
        var label = sk.kind === 'location' ? sk.label : sk.kind === 'time' ? svTimeNow() : sk.prompt;
        d.innerHTML = '<span class="se-pill-el"><svg viewBox="0 0 24 24" fill="' + ic[1] + '">' + SE_ART[ic[0]] + '</svg><span class="sv-pill-txt">' + esc(label || '') + '</span></span>';
        if (sk.kind === 'time'){
          var txtEl = d.querySelector('.sv-pill-txt');
          clockIv = setInterval(function(){ if (txtEl) txtEl.textContent = svTimeNow(); }, 5000);
        }
      } else if (sk.kind === 'link' || sk.kind === 'addyours' || sk.kind === 'mention'){
        d = document.createElement('button');
        d.type = 'button';
        d.className = 'se-el';
        if (sk.kind === 'link'){
          d.innerHTML = '<span class="se-pill-el"><svg viewBox="0 0 24 24" fill="#4da3ff">' + SE_ART.link + '</svg>' + esc(sk.label || 'Visit link') + '</span>';
          d.addEventListener('click', function(ev){ ev.stopPropagation(); window.open(sk.url, '_blank', 'noopener'); });
        } else if (sk.kind === 'addyours'){
          d.innerHTML = '<span class="se-pill-el"><svg viewBox="0 0 24 24" fill="#32d74b">' + SE_ART.chat + '</svg>Add yours: ' + esc(sk.prompt || '') + '</span>';
          d.addEventListener('click', function(ev){ ev.stopPropagation();
            location.href = '/stories/new?prompt=' + encodeURIComponent(sk.prompt || ''); });
        } else {
          d.innerHTML = '<span class="se-pill-el"><svg viewBox="0 0 24 24" fill="#bf5af2">' + SE_ART.at + '</svg>@' + esc(sk.name || '') + '</span>';
          d.addEventListener('click', function(ev){ ev.stopPropagation(); location.href = '/user/' + sk.uid; });
        }
      } else { return; }
      elPosV(d, sk);
      editLayer.appendChild(d);
    });
    if (e.captions){
      captionsEl.hidden = false;
      captionsEl.textContent = e.captions;
    } else { captionsEl.hidden = true; }
    // reshare: only for a mentioned viewer on someone else's story
    var mentioned = (e.mentions || []).indexOf(ME) >= 0;
    reshareBtn.hidden = !(mentioned && !s.mine);
    reshareBtn.onclick = function(){
      reshareBtn.disabled = true;
      fetch('/story/' + s.id + '/reshare', {method: 'POST'}).then(function(r){ return r.json(); })
        .then(function(dd){
          reshareBtn.disabled = false;
          if (dd && dd.ok){ reshareBtn.textContent = '✓ Shared to your story'; reshareBtn.hidden = false; }
        }).catch(function(){ reshareBtn.disabled = false; });
    };
  }

  function buildBars(item) {
    barsEl.innerHTML = '';
    item.g.stories.forEach(function (s, i) {
      var seg = document.createElement('div');
      seg.className = 'sv-seg' + (i < item.si ? ' done' : '');
      seg.title = 'Jump to this story';
      var fill = document.createElement('i');
      if (i < item.si) fill.style.width = '100%';
      seg.appendChild(fill);
      // Segments are controls: tapping one jumps straight to it.
      seg.addEventListener('click', function () {
        var target = flat.findIndex(function (x) { return x.s.id === s.id; });
        if (target >= 0 && target !== idx) show(target);
      });
      barsEl.appendChild(seg);
    });
  }
  function activeFill() {
    var segs = barsEl.children;
    if (!segs.length) return null;
    var item = flat[idx];
    var seg = segs[item.si];
    return seg ? seg.firstChild : null;
  }

  function tick() {
    var fill = activeFill();
    var e = elapsed();
    if (fill) fill.style.width = Math.min(100, (e / durationMs) * 100) + '%';
    // enforce the music clip window: loop it under long videos, else stop
    if (curMusic && ytPlayer) {
      var mt = -1;
      try { mt = ytPlayer.getCurrentTime(); } catch (err) {}
      var mend = (curMusic.start || 0) + (curMusic.len || 15);
      if (mt >= 0 && mt >= mend) {
        var item = flat[idx];
        if (item && item.s.is_video && !vidEnded && e < durationMs - 250) {
          try { ytPlayer.seekTo(curMusic.start || 0, true); } catch (err2) {}
        } else {
          ytPause();
        }
      }
    }
    var curItem = flat[idx];
    if (curItem && curItem.s.is_video) {
      var ced = curItem.s.edit || {};
      if (ced.trim && vid.duration && vid.currentTime >= ced.trim.end) { go(1); return; }
      if (ced.boomerang && vid.duration) {
        if (!boomRev && vid.currentTime >= vid.duration - 0.07) {
          boomRev = true;
          try { vid.pause(); } catch (e3) {}
        } else if (boomRev) {
          var nt = vid.currentTime - 0.05;
          if (nt <= 0.05) {
            boomRev = false;
            try { vid.currentTime = 0; vid.play(); } catch (e4) {}
          } else {
            try { vid.currentTime = nt; } catch (e5) {}
          }
        }
      }
    }
    if (e >= durationMs) go(1);
  }

  function setupMusic(s) {
    // Only YouTube music plays; legacy catalog/upload stories arrive
    // with music=null from the server and simply stay silent.
    curMusic = (s.music && s.music.kind === 'youtube') ? s.music : null;
    novol.hidden = true;
    if (!curMusic) { ytWrap.hidden = true; musicEl.hidden = true; return; }
    ytWrap.hidden = false;
    musicEl.hidden = false;
    musicEl.textContent = '🎵 ' + (curMusic.title || 'Music') +
      (curMusic.artist ? ' — ' + curMusic.artist : '');
    var m = curMusic;
    var slot = document.createElement('div');
    ytSlot.appendChild(slot);
    window.hereLoadYT(function () {
      if (curMusic !== m) return;  // moved on while the API loaded
      ytPlayer = new YT.Player(slot, {
        width: '200', height: '113', videoId: m.video_id,
        playerVars: { start: m.start || 0, rel: 0, playsinline: 1,
                      modestbranding: 1 },
        events: {
          onReady: function (ev) {
            try {
              ev.target.setVolume(Math.max(0, Math.min(100,
                m.volume == null ? 80 : m.volume)));
              ev.target.playVideo();
            } catch (e) {}
            // If audible autoplay got blocked anyway, surface the
            // tap-for-sound chip; tapping it plays + unmutes.
            setTimeout(function () {
              if (curMusic !== m || !ytPlayer) return;
              var st = -1;
              try { st = ytPlayer.getPlayerState(); } catch (e) {}
              if (st !== 1 && st !== 3) novol.hidden = false;
            }, 1600);
          }
        }
      });
    });
  }

  /* --- story poll (games pack): buttons until the viewer votes;
     result bars for voters and for the story's owner. The payload
     (queue JSON) carries counts + my_choice, so rendering is local;
     a vote posts and re-renders from the server's tallies. --- */
  function pollPct(n, total) {
    return total ? Math.round(100 * n / total) : 0;
  }
  function renderPoll(s) {
    var p = s.poll;
    if (!p) { pollEl.hidden = true; pollBody.innerHTML = ''; return; }
    pollEl.hidden = false;
    pollQ.textContent = '📊 ' + p.question;
    pollBody.innerHTML = '';
    if (s.mine || p.my_choice) {
      [['a', p.a_text, p.a_votes], ['b', p.b_text, p.b_votes]]
        .forEach(function (row) {
          var d = document.createElement('div');
          d.className = 'sv-poll-row' + (p.my_choice === row[0] ? ' mine' : '');
          var fill = document.createElement('div');
          fill.className = 'sv-poll-fill';
          fill.style.width = pollPct(row[2], p.total) + '%';
          d.appendChild(fill);
          var t = document.createElement('span');
          t.className = 't';
          t.textContent = row[1] + (p.my_choice === row[0] ? ' ✓' : '');
          d.appendChild(t);
          var pc = document.createElement('span');
          pc.className = 'p';
          pc.textContent = pollPct(row[2], p.total) + '% · ' + row[2];
          d.appendChild(pc);
          pollBody.appendChild(d);
        });
    } else {
      [['a', p.a_text], ['b', p.b_text]].forEach(function (row) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sv-poll-btn';
        b.textContent = row[1];
        b.addEventListener('click', function () { voteStoryPoll(row[0]); });
        pollBody.appendChild(b);
      });
    }
    pollTotal.textContent = p.total + (p.total === 1 ? ' vote' : ' votes');
  }
  function voteStoryPoll(choice) {
    var item = flat[idx];
    if (!item || !item.s.poll) return;
    pauseClock();
    postStoryAction('/story/' + item.s.id + '/poll/vote', {choice: choice})
      .then(function (res) {
        if (res.d && res.d.ok) {
          item.s.poll.my_choice = res.d.my_choice;
          item.s.poll.a_votes = res.d.a_votes;
          item.s.poll.b_votes = res.d.b_votes;
          item.s.poll.total = res.d.total;
          renderPoll(item.s);
          flashNote('Vote counted ✓');
        } else {
          flashNote((res.d && res.d.error) || 'Could not vote.');
        }
      })
      .catch(function () { flashNote('Could not vote.'); });
  }
  /* Poll taps belong to the poll, never to stage navigation. */
  ['pointerdown', 'pointerup', 'click'].forEach(function (ev) {
    pollEl.addEventListener(ev, function (e) { e.stopPropagation(); });
  });

  function loadViewers(sid) {
    viewersCount.textContent = '0';
    fetch('/story/' + sid + '/viewers')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) viewersCount.textContent = d.viewers.length;
      }).catch(function () {});
  }

  function show(i) {
    stopAll();
    viewersSheet.hidden = true;
    idx = i;
    // No end card: running off the last story just closes the viewer,
    // exactly like the ✕. Any story can be reopened from the tray at
    // any time while it's live — seen state never blocks viewing.
    if (i >= flat.length) { closeViewer(); return; }
    var item = flat[idx], s = item.s, g = item.g;
    vidEnded = false;
    avatarEl.innerHTML = avatarHTML(g);
    nameEl.textContent = g.name;
    whenEl.textContent = timeLeft(s) + (s.mine ? ' · Your story' : '') +
      (s.audience === 'public' ? ' · 🌐 Public' : '');
    buildBars(item);

    // Hide AND clear BOTH media elements first, then set up only the
    // active one. A stale src (or a buffered video frame) on the
    // inactive element is what produced the half-and-half split screen
    // when stories transitioned between photo and video.
    img.hidden = true;
    img.removeAttribute('src');
    try { vid.pause(); } catch (e) {}
    vid.hidden = true;
    vid.removeAttribute('src');
    try { vid.load(); } catch (e) {}  // drop any buffered frame

    if (s.is_video) {
      vid.hidden = false;
      vid.src = s.media;
      vid.muted = !!(s.music && s.music.mute_orig);
      vid.volume = s.music ? (s.music.mute_orig ? 0 : 0.25) : 1;
      durationMs = 15000; // provisional until metadata lands
      vid.addEventListener('loadedmetadata', function () {
        if (flat[idx] !== item) return;
        var d = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 15;
        var used = Math.min(elapsed(), durationMs);
        durationMs = Math.min(d, 60) * 1000;
        var ed = item.s.edit || {};
        if (ed.trim && ed.trim.end > ed.trim.start) {
          try { vid.currentTime = ed.trim.start; } catch (e2) {}
          durationMs = Math.min(ed.trim.end - ed.trim.start, 60) * 1000;
        } else if (ed.boomerang) {
          durationMs = Math.min(d * 3, 15) * 1000;  // ~3 bounces
        }
        accum = Math.min(used, durationMs - 1);
        startedAt = performance.now();
      }, { once: true });
      var p = vid.play();
      if (p) p.catch(function () {
        vid.muted = true;
        vid.play().catch(function () {});
        novol.hidden = false;
      });
    } else {
      img.hidden = false;
      img.src = s.media;
      durationMs = s.music
        ? Math.max(5, Math.min(30, s.music.len || 15)) * 1000
        : 5000;
    }

    if (s.overlay) {
      overlayEl.hidden = false;
      overlayEl.textContent = s.overlay.text;
      overlayEl.style.color = s.overlay.color || '#ffffff';
      overlayEl.className = 'sv-overlay pos-' + (s.overlay.pos || 'bottom');
    } else {
      overlayEl.hidden = true;
    }
    if (s.caption) {
      captionEl.hidden = false;
      captionEl.textContent = s.caption;
    } else {
      captionEl.hidden = true;
    }
    setupMusic(s);

    ownBar.hidden = !s.mine;
    if (s.mine) {
      delForm.action = '/story/' + s.id + '/delete';
      loadViewers(s.id);
    }
    // Someone else's story gets the reply + reaction bar instead;
    // the taller bar also lifts the YouTube mini player clear of it.
    replyBar.hidden = s.mine;
    ytWrap.style.bottom = s.mine ? '' : '158px';
    if (!s.mine) {
      replyInput.placeholder = 'Reply to ' + g.name + '…';
      replyNote.hidden = true;
    }
    renderPoll(s);
    renderEdit(s);
    amaForm.hidden = !(s.ama && !s.mine);
    if (amaForm.hidden) amaInput.value = '';
    if (!s.seen) {
      s.seen = true;
      fetch('/story/' + s.id + '/view', { method: 'POST' }).catch(function () {});
    }
    startClock();
    ticker = setInterval(tick, 50);
  }

  function go(dir) {
    var n = idx + dir;
    if (n < 0) { // restart the first story rather than leaving
      show(0);
      return;
    }
    show(n);
  }

  // --- tap / hold on the stage: quick tap navigates, hold pauses ---
  var pressAt = 0, pressX = 0, holding = false;
  stage.addEventListener('pointerdown', function (e) {
    pressAt = performance.now();
    pressX = e.clientX;
    holding = true;
    pauseClock();
  });
  function endPress(e) {
    if (!holding) return;
    holding = false;
    var quick = performance.now() - pressAt < 300;
    if (quick) {
      var w = stage.clientWidth || window.innerWidth;
      if (pressX < w / 3) { go(-1); return; }
      if (pressX > (w * 2) / 3) { go(1); return; }
    }
    resumeClock();
  }
  stage.addEventListener('pointerup', endPress);
  stage.addEventListener('pointercancel', function () {
    if (holding) { holding = false; resumeClock(); }
  });
  // clicks after drags on media shouldn't select anything
  stage.addEventListener('click', function (e) { e.preventDefault(); });

  vid.addEventListener('ended', function () {
    vidEnded = true;
    go(1);
  });

  document.getElementById('sv-close').addEventListener('click', closeViewer);
  novol.addEventListener('click', function () {
    novol.hidden = true;
    var item = flat[idx];
    if (item && item.s.is_video && !(item.s.music && item.s.music.mute_orig)) {
      vid.muted = false;
      vid.volume = item.s.music ? 0.25 : 1;
      vid.play().catch(function () {});
    }
    if (curMusic && ytPlayer) {
      try {
        ytPlayer.setVolume(Math.max(0, Math.min(100,
          curMusic.volume == null ? 80 : curMusic.volume)));
        ytPlayer.playVideo();
      } catch (e) {}
    }
  });
  viewersBtn.addEventListener('click', function () {
    var item = flat[idx];
    if (!item) return;
    pauseClock();
    viewersList.innerHTML = 'Loading…';
    viewersSheet.hidden = false;
    fetch('/story/' + item.s.id + '/viewers')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok || !d.viewers.length) {
          viewersList.innerHTML = '<p style="color:rgba(255,255,255,.65)">No views yet.</p>';
          return;
        }
        viewersList.innerHTML = d.viewers.map(function (v) {
          var av = v.avatar
            ? '<img class="avatar av-40" src="' + esc(v.avatar) + '" alt="">'
            : '<span class="av-ph av-40">' + esc((v.name || '?').charAt(0).toUpperCase()) + '</span>';
          return '<div class="sv-viewer-row">' + av + '<span>' + esc(v.name) +
                 '</span><span class="when">' + esc(v.when) + '</span></div>';
        }).join('');
      }).catch(function () {
        viewersList.innerHTML = '<p>Could not load viewers.</p>';
      });
  });
  document.getElementById('sv-viewers-close').addEventListener('click', function () {
    viewersSheet.hidden = true;
    resumeClock();
  });

  // --- story replies + reactions: both land in the owner's inbox as
  // story-linked messages (the server attaches the clip). Feedback is
  // a short note in the bar; failures show the server's wording. ---
  var noteTimer = null;
  function flashNote(text) {
    replyNote.textContent = text;
    replyNote.hidden = false;
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { replyNote.hidden = true; }, 2200);
  }
  function postStoryAction(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false }; })
        .then(function (d) { return { status: r.status, d: d }; });
    });
  }
  replyForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var item = flat[idx];
    var body = replyInput.value.trim();
    if (!item || !body) return;
    postStoryAction('/story/' + item.s.id + '/reply', { body: body })
      .then(function (res) {
        if (res.d && res.d.ok) {
          replyInput.value = '';
          flashNote('Sent ✓');
          replyInput.blur();
        } else {
          flashNote((res.d && res.d.error) || 'Could not send.');
        }
      })
      .catch(function () { flashNote('Could not send.'); });
  });
  // --- AMA: the question rides the story-reply path server-side and
  // lands in the author's inbox as a story message (marked as a
  // question). Same in-bar feedback as replies. ---
  amaForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var item = flat[idx];
    var text = amaInput.value.trim();
    if (!item || !text) return;
    postStoryAction('/story/' + item.s.id + '/ama', { text: text })
      .then(function (res) {
        if (res.d && res.d.ok) {
          amaInput.value = '';
          flashNote('Question sent ✓');
          amaInput.blur();
        } else {
          flashNote((res.d && res.d.error) || 'Could not send.');
        }
      })
      .catch(function () { flashNote('Could not send.'); });
  });
  amaInput.addEventListener('focus', pauseClock);
  amaInput.addEventListener('blur', function () {
    if (viewersSheet.hidden) resumeClock();
  });
  // Typing must not watch the story run out from under you.
  replyInput.addEventListener('focus', pauseClock);
  replyInput.addEventListener('blur', function () {
    if (viewersSheet.hidden) resumeClock();
  });
  document.getElementById('sv-react-row').addEventListener('click',
    function (e) {
      var btn = e.target.closest('button[data-kind]');
      if (!btn) return;
      var item = flat[idx];
      if (!item) return;
      postStoryAction('/story/' + item.s.id + '/react',
                      { kind: btn.getAttribute('data-kind') })
        .then(function (res) {
          if (res.d && res.d.ok) {
            flashNote(btn.textContent + ' sent');
            btn.classList.add('sent');
            setTimeout(function () { btn.classList.remove('sent'); }, 600);
          } else {
            flashNote((res.d && res.d.error) || 'Could not react.');
          }
        })
        .catch(function () { flashNote('Could not react.'); });
    });

  document.addEventListener('keydown', function (e) {
    // Arrows/Escape belong to the reply input while it's being typed in.
    if (e.target && (e.target.tagName === 'INPUT'
                     || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  // swipe down to close
  var touchY = null, touchX = null;
  root.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      touchY = e.touches[0].clientY; touchX = e.touches[0].clientX;
    }
  }, { passive: true });
  root.addEventListener('touchend', function (e) {
    if (touchY === null) return;
    var dy = e.changedTouches[0].clientY - touchY;
    var dx = e.changedTouches[0].clientX - touchX;
    touchY = null;
    if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeViewer();
  }, { passive: true });

  fetch('/stories/queue')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      ME = data.me || 0;
      (data.groups || []).forEach(function (g) {
        g.stories.forEach(function (s, si) {
          flat.push({ g: g, s: s, si: si });
        });
      });
      if (!flat.length) { closeViewer(); return; }
      var start = flat.findIndex(function (x) { return x.s.id === startId; });
      show(start >= 0 ? start : 0);
    })
    .catch(function () { closeViewer(); });
})();
</script>
{% endblock %}
