<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Card — HERE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:#0a0a0a;color:#f0f0f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{font-size:56px;font-weight:900;color:#ffd400;letter-spacing:-2px}
.sub{color:#9a9a9a;margin:6px 0 24px;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.auth-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:28px;width:100%;max-width:420px}
.auth-card h2{margin-bottom:8px;font-size:20px}
.note{color:#9a9a9a;font-size:13px;margin-bottom:16px;line-height:1.5}
.err{background:rgba(212,31,46,.15);border:1px solid #d41f2e;color:#ff8f98;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:#bbb;margin-bottom:5px}
.field input{width:100%;background:#1f1f1f;border:1px solid #333;border-radius:8px;padding:11px 13px;color:#f0f0f0;font-size:15px;outline:none}
.field input:focus{border-color:#ffd400}
.btn{width:100%;background:#d41f2e;color:#fff;border:none;border-radius:8px;padding:12px;font-size:16px;font-weight:800;cursor:pointer}
.btn:hover{background:#a8151f}
.alt{margin-top:16px;text-align:center;font-size:13px;color:#9a9a9a}
.alt a{color:#ffd400;text-decoration:none;font-weight:700}
details{margin-top:14px}
summary{font-size:13px;color:#9a9a9a;cursor:pointer}
</style>
</head>
<body>
<div class="brand">H</div>
<div class="sub">Owner Key Card</div>
<div class="auth-card">
  <h2>💳 Swipe your Key Card</h2>
  <p class="note">Tap the box below, then swipe your card through the MSR reader. The vault opens by itself.</p>
  {% if error %}<div class="err">{{ error|e }}</div>{% endif %}
  <form action="/keycard" method="post" id="kc-form">
    <div class="field">
      <label for="kc-swipe">Card swipe</label>
      <input type="password" id="kc-swipe" name="swipe" autocomplete="off" autofocus placeholder="Tap here, then swipe…">
    </div>
    <button type="submit" class="btn">Open the Vault</button>
    <details>
      <summary>Reader acting up? Type the card by hand</summary>
      <div class="field" style="margin-top:12px">
        <label for="kc-no">Card number (Track 1 / 2)</label>
        <input type="text" id="kc-no" name="card_no" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label for="kc-secret">Card secret (28 numbers: Track 2 + Track 3)</label>
        <input type="password" id="kc-secret" name="secret" inputmode="numeric" autocomplete="off">
      </div>
    </details>
  </form>
  <p class="alt">No card handy? <a href="/owner/login">Type the admin password instead</a></p>
</div>
<script>
// Most MSR readers end a swipe with Enter, which submits the form
// on its own. If a reader sends the tracks without Enter, submit
// shortly after the swipe text lands.
(function(){
  var el = document.getElementById('kc-swipe'), t = null;
  el.addEventListener('input', function(){
    clearTimeout(t);
    if (el.value.length > 20) {
      t = setTimeout(function(){ document.getElementById('kc-form').submit(); }, 600);
    }
  });
})();
</script>
</body>
</html>
